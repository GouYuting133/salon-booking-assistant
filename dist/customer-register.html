<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客户入口 · 简爱美发造型沙龙</title>
  <link rel="stylesheet" href="/style.css?v=20261024-5">
  <link rel="stylesheet" href="/customer-register.css?v=20261112-6">
  <script src="/network-core.js?v=20261027-1" defer></script>
  <script src="/customer-register.js?v=20261113-1" defer></script>
</head>
<body>
  <main class="customer-entry card">
    <p class="eyebrow">简爱美发造型沙龙</p>
    <h1 id="entry-title">创建我的理发助手</h1>
    <p id="entry-description">注册后可以自己预约，也可以查看自己的预约和到店记录。</p>
    <form id="customer-entry">
      <label id="entry-name">称呼（选填）
        <input name="name" maxlength="40" autocomplete="nickname">
      </label>
      <label><span id="entry-username-label">手机号</span>
        <input name="username" required minlength="11" maxlength="11" pattern="1[3-9][0-9]{9}" inputmode="tel" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="请输入 11 位手机号">
      </label>
      <div>
        <label for="entry-password">密码</label>
        <div class="entry-password-field">
          <input id="entry-password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="至少 8 个字符">
          <button id="entry-password-toggle" type="button" aria-label="显示密码" aria-controls="entry-password">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/>
              <circle cx="12" cy="12" r="2.5"/>
              <path class="password-eye-slash" d="M4 4l16 16"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit">注册并进入</button>
      <p id="entry-status" role="status" aria-live="polite"></p>
    </form>
    <button id="entry-switch" class="secondary" type="button">已有账号，去登录</button>
  </main>
</body>
</html>
